const SEED=[{id:'10482',vehicle:'2021 Ford F-150',ro:'4832',concern:'Transmission slipping under load',status:'Action required',stage:2,request:['Diagnostic scan report','Technician findings','Photos of affected components'],sent:false,authorized:0,invoice:false,paid:false,messages:[{by:'EDS Claims',text:'Please provide the diagnostic scan report, technician findings, and photos of the affected components.'}],activity:['Claim submitted','EDS requested supporting documentation']},{id:'10476',vehicle:'2020 Chevrolet Silverado',ro:'4819',concern:'A/C compressor failure',status:'Ready for invoice',stage:3,request:[],sent:true,authorized:1420,invoice:false,paid:false,messages:[{by:'EDS Claims',text:'Repair authorization has been issued. Please upload the final invoice after repairs are complete.'}],activity:['Claim submitted','Repair authorized']},{id:'10453',vehicle:'2019 Honda CR-V',ro:'4771',concern:'Water pump leaking',status:'Under review',stage:1,request:[],sent:true,authorized:0,invoice:false,paid:false,messages:[],activity:['Claim submitted']},{id:'10421',vehicle:'2022 Toyota Tacoma',ro:'4736',concern:'Starter motor failure',status:'Paid',stage:5,request:[],sent:true,authorized:875,invoice:true,paid:true,messages:[],activity:['Claim submitted','Repair authorized','Invoice reviewed','Payment issued']}];
const clone=o=>JSON.parse(JSON.stringify(o));let claimFiles={},techFileNames={};let claims=clone(SEED);let page='home',selected='10482',tab='overview',query='',filter='All',wizardStep=0,draft={vin:'',vehicle:'',contract:'',customer:'',lookup:'',lookupType:'vin',mileage:'',ro:'',arrival:'',arrivalMethod:'',alreadyRental:'',concern:'',diagnosis:'',parts:'',labor:'',notes:''},evidence={},techFiles=[],draftSaved=false;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),get=()=>claims.find(x=>x.id===selected)||claims[0];
function btn(text,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`}function toast(t){let old=$('toast');if(old)old.remove();let e=document.createElement('div');e.id='toast';e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}
function head(){return `<div class="hero"><div><div class="eyebrow">Your service desk</div><h1>Good morning, Jordan.</h1><p>Let's keep your repairs moving.</p></div></div>`}
function openClaim(c,t='overview'){selected=c.id;tab=t;page='detail';render()}
function attention(){return claims.filter(c=>c.request.length&&!c.sent||c.authorized&&!c.invoice)}
function home(){let a=attention();return `${head()}<div class="quick"><button class="btn large" data-action="start"><span class="symbol">＋</span><span>Start a claim<span class="description">Open a new repair request</span></span><span class="arrow">→</span></button><button class="btn large" data-action="find"><span class="symbol">⌕</span><span>Find a claim<span class="description">Search by claim, VIN, or repair order</span></span><span class="arrow">→</span></button></div><div class="section-head"><h2>Needs your attention</h2><span class="tag amber">${a.length} ${a.length===1?'item':'items'}</span></div><div class="panel">${a.length?a.map(c=>`<button class="task" data-open="${c.id}" data-tab="${c.authorized?'invoice':'documents'}"><span class="symbol">${c.authorized?'▤':'▧'}</span><span><strong>${esc(c.vehicle)}</strong><span class="meta">Claim #${c.id} · ${c.authorized?'Ready to submit final invoice':c.request.length+' document(s) requested'}</span></span><span class="action">${c.authorized?'Upload invoice':'Respond to request'} →</span></button>`).join(''):'<div class="empty">You’re all caught up. No actions needed right now.</div>'}</div><div class="section-head"><h2>Recent claims</h2><button class="link" data-action="find">View all →</button></div><div class="cards">${claims.slice(0,3).map(c=>`<button class="claim-card" data-open="${c.id}"><div class="row"><small class="muted">#${c.id}</small><span class="tag ${c.status==='Action required'?'amber':c.status==='Under review'?'blue':'green'}">${c.status}</span></div><h3>${esc(c.vehicle)}</h3><p>${esc(c.concern)}</p><small class="muted">RO-${c.ro} · View claim →</small></button>`).join('')}</div><div class="demo">Fictional example data · No connection to EDS Claims</div>`}
function claimsPage(){let items=claims.filter(c=>(filter==='All'||c.status===filter)&&[c.id,c.vehicle,c.ro,c.concern].join(' ').toLowerCase().includes(query.toLowerCase()));return `<div class="eyebrow">Quick lookup</div><h1>Find a claim</h1><p>Open a repair to see its status, messages, and next step.</p><div class="toolbar"><input class="search" id="search" value="${esc(query)}" placeholder="Claim number, vehicle, RO, or concern" aria-label="Search claims"><select id="filter" class="search" style="max-width:180px"><option>All</option>${['Action required','Ready for invoice','Under review','Paid'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="claim-list">${items.length?items.map(c=>`<button class="task" data-open="${c.id}"><span class="symbol">▤</span><span><strong>${esc(c.vehicle)} · #${c.id}</strong><span class="meta">RO-${c.ro} · ${esc(c.concern)}</span></span><span class="action">${c.status} →</span></button>`).join(''):'<div class="panel empty">No claims found. Try another search.</div>'}</div>`}
function detail(){const c=get();let next=c.request.length&&!c.sent?'docs':c.authorized&&!c.invoice?'invoice':c.invoice&&!c.paid?'waiting':c.paid?'done':c.status==='Under review'?'review':'waiting';let title={docs:'EDS needs supporting documents',invoice:'Final invoice is ready to submit',waiting:'Waiting on EDS Claims',done:'Claim completed',review:'EDS is reviewing this claim'}[next];let desc={docs:`Upload ${c.request.length} requested items to help EDS continue review.`,invoice:'The repair has been authorized. Submit the completed repair invoice.',waiting:'No action needed right now. We’ll show updates here.',done:'Payment has been issued in this fictional demonstration.',review:'No action needed unless EDS asks for more information.'}[next];return `<div class="workspace"><div class="crumb"><button data-action="find">My claims</button> › Claim #${c.id}</div><div class="claim-heading"><div><div class="eyebrow">Claim #${c.id} · RO-${c.ro}</div><h1>${esc(c.vehicle)}</h1><p>${esc(c.concern)}</p></div><span class="tag ${c.status==='Action required'?'amber':c.status==='Under review'?'blue':'green'}">${c.status}</span></div><div class="panel progress"><strong>Repair claim progress</strong><div class="steps">${[1,2,3,4,5].map(i=>`<div class="step ${c.stage>i?'done':c.stage===i?'current':''}"></div>`).join('')}</div><div class="progress-labels"><span>Submitted</span><span>Under review</span><span>Authorized</span><span>Invoiced</span><span>Completed</span></div></div><div class="callout ${['waiting','done','review'].includes(next)?'green':''}"><div class="eyebrow">${['waiting','done','review'].includes(next)?'Current status':'Your next step'}</div><h2>${title}</h2><p>${desc}</p>${next==='docs'?btn('Upload requested documents →','docs','primary'):next==='invoice'?btn('Submit final invoice →','invoice','primary'):''}</div><div class="tabs" role="tablist">${[['overview','Overview'],['messages','Messages'],['documents','Documents'],['invoice','Authorization & invoice'],['activity','Activity']].map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}" role="tab" aria-selected="${tab===k}">${v}</button>`).join('')}</div><div id="tab-content">${tabContent(c)}</div></div>`}
function tabContent(c){if(tab==='overview')return `<div class="details-grid"><section class="panel info"><h3>Vehicle & repair</h3><div class="kv"><span>Vehicle</span><b>${esc(c.vehicle)}</b></div><div class="kv"><span>Repair order</span><b>RO-${c.ro}</b></div><div class="kv"><span>Concern</span><b>${esc(c.concern)}</b></div><div class="kv"><span>Claim</span><b>#${c.id}</b></div></section><section class="panel info"><h3>Claim at a glance</h3><div class="kv"><span>Claim status</span><b>${c.status}</b></div><div class="kv"><span>Authorization</span><b>${c.authorized?'$'+c.authorized.toLocaleString():'Not issued'}</b></div><div class="kv"><span>Invoice</span><b>${c.invoice?'Submitted':'Not submitted'}</b></div><div class="kv"><span>Payment</span><b>${c.paid?'Issued':'Not issued'}</b></div></section></div><div class="section-head"><h2>Need help?</h2></div><p>Ask EDS Claims a question about this repair.</p>${btn('Message EDS Claims →','messages')}`;if(tab==='messages')return `<div class="panel section-body"><h2>Conversation with EDS Claims</h2><p>Messages stay with this claim.</p>${c.messages.length?c.messages.map(m=>`<div class="message ${m.by==='You'?'me':''}"><small>${esc(m.by)}</small>${esc(m.text)}</div>`).join(''):'<p>No messages on this claim yet.</p>'}<div class="field"><label for="message">New message</label><textarea id="message" placeholder="Type a question about this claim..."></textarea></div>${btn('Send message','send-message','primary')}<p class="helper">Demo only: messages stay in this browser.</p></div>`;if(tab==='documents')return `<div class="panel section-body"><h2>Requested documents</h2><p>Attach the items EDS asked for. File selection does not transmit a file to EDS.</p>${c.request.length?c.request.map((r,i)=>`<div class="request"><strong>${esc(r)}</strong><small>${evidence[c.id+'_'+i]?.name?'Selected: '+esc(evidence[c.id+'_'+i].name):'No file selected'}</small><input type="file" accept="image/*,.pdf" data-file="${i}" aria-label="Select ${esc(r)}"></div>`).join(''):'<div class="empty">No outstanding document requests on this claim.</div>'}${c.request.length?btn('Record demo response','submit-evidence','primary'):''}${c.sent?'<p class="helper">A demo response is recorded on this claim.</p>':''}</div>`;if(tab==='invoice')return `<div class="panel section-body"><h2>Authorization & invoice</h2><div class="kv"><span>Authorized repair amount</span><b>${c.authorized?'$'+c.authorized.toLocaleString():'No authorization issued'}</b></div><div class="kv"><span>Invoice status</span><b>${c.invoice?'Submitted':'Not submitted'}</b></div>${c.authorized&&!c.invoice?`<div class="field"><label for="inv">Final invoice amount ($)</label><input id="inv" type="number" min="0" step=".01" placeholder="e.g. ${c.authorized}"></div><div class="field"><label for="invfile">Invoice document</label><input id="invfile" type="file" accept=".pdf,image/*"></div>${btn('Record demo invoice submission','submit-invoice','primary')}<p class="helper">The prototype cannot approve invoices or upload file contents.</p>`:c.invoice?'<p>Invoice recorded. Awaiting the authoritative EDS payment decision.</p>':'<p>The invoice step becomes available only after confirmed authorization.</p>'}</div>`;return `<div class="panel section-body"><h2>Claim activity</h2>${c.activity.map(t=>`<div class="notification">● ${esc(t)}</div>`).join('')}</div>`}
const DEMO_CONTRACTS=[{contract:'EDS-2045187',customer:'Morgan Hayes',vin:'1FTFW1E58MFA48321',vehicle:'2021 Ford F-150',status:'Active'},{contract:'EDS-2045351',customer:'Morgan Hayes',vin:'1GCUYDED7LZ211436',vehicle:'2020 Chevrolet Silverado',status:'Active'},{contract:'EDS-2039109',customer:'Taylor Reed',vin:'2HKRW2H50KH612847',vehicle:'2019 Honda CR-V',status:'Expired'}];
let matches=[],contractChosen=false;
function findContracts(){let q=(draft.lookup||'').trim().toUpperCase(),type=draft.lookupType||'vin';if(!q)return toast('Enter a search value first.');if(type==='vin'&&!/^[A-HJ-NPR-Z0-9]{8}$/i.test(q))return toast('Enter the last 8 VIN characters.');matches=DEMO_CONTRACTS.filter(c=>type==='vin'?c.vin.slice(-8).toUpperCase()===q:type==='name'?c.customer.split(' ').slice(-1)[0].toUpperCase().includes(q):c.contract.toUpperCase().includes(q));contractChosen=false;draft.contract='';render();if(!matches.length)toast('No matching fictional contracts. Try Hayes or EDS-2045187.');}
function wizard(){let titles=['Contract & vehicle intake','Concern & diagnosis','Repair estimate','Review & submit'],f=(key,label,placeholder='',kind='text')=>`<div class="field"><label for="${key}">${label}</label><input id="${key}" data-draft="${key}" type="${kind}" value="${esc(draft[key])}" placeholder="${placeholder}"></div>`,text=(key,label,placeholder)=>`<div class="field"><label for="${key}">${label}</label><textarea id="${key}" data-draft="${key}" placeholder="${placeholder}">${esc(draft[key])}</textarea></div>`;
let part=wizardStep===0?`<p>Locate the customer's contract, select the correct result, then record the vehicle's arrival details.</p><div class="field"><label for="lookupType">Search by</label><select id="lookupType" data-draft="lookupType"><option value="vin" ${draft.lookupType==='vin'?'selected':''}>Last 8 of VIN</option><option value="name" ${draft.lookupType==='name'?'selected':''}>Customer last name</option><option value="contract" ${draft.lookupType==='contract'?'selected':''}>Contract number</option></select></div>${f('lookup','Contract lookup','Last 8 VIN, last name, or contract number')}<button class="btn primary" data-action="find-contracts" type="button">Find contracts →</button><p class="helper">Fictional matches for demonstration. Try last name Hayes, or contract EDS-2045187.</p>${matches.length?`<div class="section-head"><h3>Matching contracts</h3></div><div class="claim-list">${matches.map(c=>`<button class="task ${draft.contract===c.contract?'chosen-contract':''}" data-contract="${esc(c.contract)}" type="button"><span class="symbol">▤</span><span><strong>${esc(c.customer)} · ${esc(c.vehicle)}</strong><span class="meta">${esc(c.contract)} · VIN ending ${esc(c.vin.slice(-8))} · ${esc(c.status)}</span></span><span class="action">${draft.contract===c.contract?'Selected ✓':'Select →'}</span></button>`).join('')}</div>`:''}${contractChosen?`<div class="callout green"><strong>Selected contract: ${esc(draft.contract)}</strong><p>${esc(draft.customer)} · ${esc(draft.vehicle)} · This contract is a demo result; coverage is not verified.</p></div><div class="section-head"><h3>Vehicle intake details</h3></div><div class="form-grid">${f('mileage','Current odometer reading','Mileage','number')}${f('ro','Repair order (RO) number','RO number')}${f('arrival','Date vehicle arrived','','date')}</div><div class="field"><label for="arrivalMethod">How did the vehicle arrive?</label><select id="arrivalMethod" data-draft="arrivalMethod"><option value="">Select one</option><option value="driven" ${draft.arrivalMethod==='driven'?'selected':''}>Driven in</option><option value="towed" ${draft.arrivalMethod==='towed'?'selected':''}>Towed in</option></select></div><div class="field"><label for="alreadyRental">Is the customer currently in a rental vehicle?</label><select id="alreadyRental" data-draft="alreadyRental"><option value="">Select Yes or No</option><option value="yes" ${draft.alreadyRental==='yes'?'selected':''}>Yes — already in a rental</option><option value="no" ${draft.alreadyRental==='no'?'selected':''}>No — not currently in a rental</option></select><small class="helper">This records current status only. It does not request or arrange a rental.</small></div>`:''}`:wizardStep===1?`${text('concern','Customer concern','What did the customer report?')}${text('diagnosis','Diagnostic findings','What tests were performed and what failed?')}`:wizardStep===2?`<div class="form-grid">${f('parts','Parts estimate ($)','0.00','number')}${f('labor','Labor estimate ($)','0.00','number')}</div>${text('notes','Additional notes (optional)','Details to help the claims adjuster')}<div class="field"><label for="claim-attachments">Photos & documents (optional)</label><input id="claim-attachments" type="file" multiple accept="image/*,.pdf"><small class="helper" id="claim-attachments-status">${Object.values(claimFiles).length?Object.values(claimFiles).map(x=>esc(x.name)).join(', '):'Select photos or PDF documents. Files remain in this browser only.'}</small></div>`:`<div class="panel section-body" style="box-shadow:none"><h3>${esc(draft.customer)} · ${esc(draft.vehicle)}</h3><p>Contract: ${esc(draft.contract)} · VIN ending ${esc(draft.vin.slice(-8))}</p><div class="kv"><span>RO / odometer</span><strong>${esc(draft.ro)} / ${esc(draft.mileage)}</strong></div><div class="kv"><span>Arrived</span><strong>${esc(draft.arrival)} · ${draft.arrivalMethod==='towed'?'Towed in':'Driven in'}</strong></div><div class="kv"><span>Currently in a rental?</span><strong>${draft.alreadyRental==='yes'?'Yes':'No'}</strong></div><div class="kv"><span>Concern</span><strong>${esc(draft.concern)}</strong></div><div class="kv"><span>Diagnosis</span><strong>${esc(draft.diagnosis)}</strong></div><div class="kv"><span>Estimated total</span><b>$${((+draft.parts||0)+(+draft.labor||0)).toFixed(2)}</b></div><div class="kv"><span>Selected attachments</span><b>${Object.values(claimFiles).length?Object.values(claimFiles).map(x=>esc(x.name)).join(', '):'None selected'}</b></div><p class="helper">Submitting creates a fictional demo claim. No actual contract was found or checked, and nothing is transmitted to EDS.</p></div>`;
return `<div class="wizard"><div class="crumb"><button data-action="home">Home</button> › New claim</div><div class="eyebrow">Guided claim submission · demo</div><h1>Start a claim</h1><p>Four focused steps. Text drafts stay in this browser session, if storage is available.</p><div class="wizard-track">${titles.map((_,i)=>`<span class="${i<=wizardStep?'done':''}"></span>`).join('')}</div><section class="panel"><small class="muted">Step ${wizardStep+1} of 4</small><h2>${titles[wizardStep]}</h2>${part}<div class="form-footer"><button class="btn" data-action="${wizardStep?'back':'home'}">${wizardStep?'← Back':'Cancel'}</button><div style="display:flex;gap:8px">${btn('Save draft','save-draft')}${btn(wizardStep===3?'Submit demo claim':'Continue →',wizardStep===3?'finish':'next','primary')}</div></div></section><div class="demo">Contract results are fictional. No live contract lookup, eligibility validation, rental booking or claim submission.</div></div>`}
function updates(){return `<div class="eyebrow">Claim notifications</div><h1>Updates</h1><p>Only the changes that matter to your repairs.</p><div class="panel">${claims.flatMap(c=>c.activity.slice(-2).map(a=>({c,a}))).map(({c,a})=>`<button class="task" data-open="${c.id}" data-tab="activity"><span class="symbol">↗</span><span><strong>${esc(a)}</strong><span class="meta">${esc(c.vehicle)} · Claim #${c.id}</span></span><span class="action">View →</span></button>`).join('')}</div>`}
function tech(){return `<div class="tech"><div class="eyebrow">Simplified technician experience · concept</div><h1>Photos & Documents</h1><p>2021 Ford F-150 · Claim #10482</p><div class="panel"><h2>What EDS needs</h2><p>Add the requested photos, diagnostic reports, and technician notes.</p>${['Diagnostic scan report','Photos of affected components','Technician findings'].map((x,i)=>`<div class="request"><strong>${x}</strong>${i===2?'<textarea id="tech-notes" placeholder="Diagnostic test results and cause of failure"></textarea>':`<input type="file" ${i===1?'accept="image/*" capture="environment"':'accept="image/*,.pdf"'} data-tech="${i}"><small>${techFiles[i]?.name?'Selected: '+esc(techFiles[i].name)+' ('+Math.round(techFiles[i].size/1024)+' KB)':'Not selected'}</small>${techFiles[i]?.type?.startsWith('image/')?`<div class="file-preview"><img src="${URL.createObjectURL(techFiles[i])}" alt="Selected component photo"></div>`:''}`}</div>`).join('')}${btn('Record demo upload','tech-submit','primary')}<p class="helper">This is a restricted workflow concept. Production technician access and permissions are not implemented.</p></div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===(page==='detail'||page==='wizard'?'claims':page)));$('app').innerHTML=page==='home'?home():page==='claims'?claimsPage():page==='detail'?detail():page==='wizard'?wizard():page==='updates'?updates():tech()}
function validate(){if(wizardStep===0){if(!draft.contract||!contractChosen)return 'Find and select a contract first.';if(!draft.ro.trim()||!draft.mileage.trim()||!Number.isFinite(+draft.mileage)||+draft.mileage<0||!draft.arrival||!draft.arrivalMethod||!draft.alreadyRental)return 'Complete odometer, RO, arrival date, arrival method, and current rental status.';if(draft.arrival>new Date().toISOString().slice(0,10))return 'Arrival date cannot be in the future.';}if(wizardStep===1&&(!draft.concern.trim()||!draft.diagnosis.trim()))return 'Add the customer concern and diagnostic findings.';if(wizardStep===2&&[draft.parts,draft.labor].some(v=>v!==''&&(!Number.isFinite(+v)||+v<0)))return 'Estimate amounts cannot be negative.';return null}
document.addEventListener('input',e=>{if(e.target.dataset.draft){draft[e.target.dataset.draft]=e.target.value;draftSaved=false;try{sessionStorage.setItem('eds-v11-draft',JSON.stringify(draft))}catch{}}if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='lookupType'){draft.lookupType=e.target.value;draft.lookup='';matches=[];contractChosen=false;draft.contract='';render();return;}if(['arrivalMethod','alreadyRental'].includes(e.target.id)){draft[e.target.id]=e.target.value;return;}if(e.target.id==='claim-attachments'){const fs=[...e.target.files];if(fs.some(f=>f.size>15*1024*1024))return toast('Each file must be 15 MB or less.');if(fs.some(f=>!f.type.startsWith('image/')&&f.type!=='application/pdf'))return toast('Choose photos or PDF documents.');claimFiles=Object.fromEntries(fs.map((f,i)=>[i,f]));const label=document.getElementById('claim-attachments-status');if(label)label.textContent=fs.length?fs.map(f=>f.name).join(', '):'No files selected';}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.dataset.file!==undefined){const k=get().id+'_'+e.target.dataset.file;evidence[k]=e.target.files[0]||null;render()}if(e.target.dataset.tech!==undefined){techFiles[+e.target.dataset.tech]=e.target.files[0]||null;render()}});
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}let row=e.target.closest('[data-open]');if(row){openClaim(claims.find(c=>c.id===row.dataset.open),row.dataset.tab||'overview');return}let t=e.target.closest('button[data-tab]');if(t){tab=t.dataset.tab;render();return}let contractButton=e.target.closest('[data-contract]');if(contractButton){let c=DEMO_CONTRACTS.find(x=>x.contract===contractButton.dataset.contract);if(c){draft.contract=c.contract;draft.customer=c.customer;draft.vehicle=c.vehicle;draft.vin=c.vin;contractChosen=true;render();}return;}let act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;if(act==='find-contracts'){findContracts();return;}if(act==='home'){page='home';render()}else if(act==='find'){page='claims';render();$('search')?.focus()}else if(act==='start'){page='wizard';wizardStep=0;matches=[];contractChosen=!!draft.contract;if(contractChosen)matches=DEMO_CONTRACTS.filter(x=>x.contract===draft.contract);render()}else if(['docs','invoice','messages'].includes(act)){tab=act==='docs'?'documents':act;render()}else if(act==='send-message'){let v=$('message').value.trim();if(!v)return toast('Write a message first.');get().messages.push({by:'You',text:v});get().activity.push('Message sent in demo');render();toast('Demo message recorded.')}else if(act==='submit-evidence'){let c=get();if(c.request.some((_,i)=>!evidence[c.id+'_'+i]))return toast('Select one file for each requested item.');c.sent=true;c.status='Under review';c.stage=2;c.activity.push('Supporting documents response recorded (demo)');render();toast('Demo evidence response recorded — not sent to EDS.')}else if(act==='submit-invoice'){let c=get(),v=+$('inv').value;if(!$('invfile').files.length||!Number.isFinite(v)||v<=0)return toast('Add an invoice document and a valid amount.');if(v>c.authorized)return toast('Invoice exceeds authorization. Request additional approval first.');c.invoice=true;c.stage=4;c.status='Invoice in review';c.activity.push('Final invoice recorded for review (demo)');render();toast('Demo invoice recorded — not sent to EDS.')}else if(act==='save-draft'){try{sessionStorage.setItem('eds-v11-draft',JSON.stringify(draft));draftSaved=true;toast('Demo draft saved in this browser session.')}catch{toast('Browser storage unavailable; keep this page open.')}}else if(act==='back'){wizardStep=Math.max(0,wizardStep-1);render()}else if(act==='next'){let err=validate();if(err)return toast(err);wizardStep=Math.min(3,wizardStep+1);render()}else if(act==='finish'){for(let i=0;i<3;i++){wizardStep=i;let err=validate();if(err){render();return toast(err)}}let id=String(Math.max(...claims.map(c=>+c.id))+1);claims.unshift({id,contract:draft.contract,customer:draft.customer,arrival:draft.arrival,arrivalMethod:draft.arrivalMethod,alreadyRental:draft.alreadyRental,mileage:draft.mileage,vehicle:draft.vehicle,ro:draft.ro,concern:draft.concern,status:'Under review',stage:1,request:[],sent:true,authorized:0,invoice:false,paid:false,messages:[],activity:['Demo claim submitted']});draft={vin:'',vehicle:'',contract:'',customer:'',lookup:'',lookupType:'vin',mileage:'',ro:'',arrival:'',arrivalMethod:'',alreadyRental:'',concern:'',diagnosis:'',parts:'',labor:'',notes:''};matches=[];contractChosen=false;try{sessionStorage.removeItem('eds-v11-draft')}catch{}claimFiles={};openClaim(claims[0]);toast('Fictional claim created — nothing submitted to EDS.')}else if(act==='tech-submit'){if(!techFiles[0]||!techFiles[1]||!$('tech-notes').value.trim())return toast('Select two files and add technician findings.');toast('Technician demo photos and notes recorded locally.')}});
try{const s=sessionStorage.getItem('eds-v11-draft');if(s){draft={...draft,...JSON.parse(s)};contractChosen=!!DEMO_CONTRACTS.find(x=>x.contract===draft.contract);if(contractChosen)matches=DEMO_CONTRACTS.filter(x=>x.contract===draft.contract)}}catch{}render();
</script></body></html>
